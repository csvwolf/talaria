name: Reissue v0.2.15 (temporary)
on:
  push:
    branches: [master]
    paths: ['.github/workflows/reissue-0215.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Validate release version and branch
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          if($env:RELEASE_TAG -ne ('v'+$version)){throw 'Tag must match VERSION'}
          git merge-base --is-ancestor HEAD origin/master
          if($LASTEXITCODE){throw 'Release commit must be on master'}
      - name: Build and test
        shell: powershell
        run: |
          ./scripts/build.ps1
          ./scripts/test.ps1 -Python (Get-Command python).Source
          ./scripts/bootstrap-installer.ps1
          ./scripts/build-installer.ps1
      - name: Test opt-in local signing on disposable runner
        timeout-minutes: 5
        shell: powershell
        run: ./scripts/test-installer-ci.ps1
      - name: Test recording component setup on disposable runner
        timeout-minutes: 8
        shell: powershell
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/Install-CaptureTools.ps1
          if($LASTEXITCODE){throw 'Recording component setup failed'}
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/Install-CaptureTools.ps1 -CheckOnly
          if($LASTEXITCODE){throw 'Recording component detection failed'}
          $capture=Get-Content (Join-Path $env:LOCALAPPDATA 'PadHop/capture-tools.json') -Raw | ConvertFrom-Json
          ./scripts/test.ps1 -Python $capture.Python
      - name: Diagnose installer failure
        if: failure()
        shell: powershell
        run: |
          Get-Content "$env:RUNNER_TEMP/padhop-install.log" -Tail 50 -ErrorAction SilentlyContinue
          Get-Content "$env:ProgramFiles/PadHop/local-signing-last.log" -Tail 50 -ErrorAction SilentlyContinue
          Get-Process | Where-Object {$_.ProcessName -match 'install|consent|PadHop|powershell'} | Select-Object ProcessName,Id,MainWindowTitle
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Talaria-installer
          path: dist/install.exe
          if-no-files-found: error
          retention-days: 14
  reissue:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: Talaria-installer
          path: release
      - name: Replace withdrawn v0.2.15 only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPAIR_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GH_REPO/releases/tags/v0.2.15 > old.json
          test "$(jq -r .draft old.json)" = true
          id=$(jq -r .id old.json)
          gh api --method PATCH repos/$GH_REPO/git/refs/tags/v0.2.15 -f sha="$REPAIR_SHA" -F force=true
          gh release upload v0.2.15 release/install.exe --clobber
          python3 - <<'PY'
          import json,re
          old=json.load(open('old.json'))
          notes=re.sub(r'\nSHA-256.*', '', old['body'], flags=re.S)
          notes+='\n\n**修正版安装包（版本仍为 v0.2.15）**：修复录制组件安装失败及日志打不开；已有组件显示“检查录制组件”，失败后可修复。已通过本机全新下载、校验和安装验证。若之前下载过此版本，请重新下载安装包。\n\nReplacement package: fixes recording component setup and log viewing. Existing components can be checked without reinstalling. Please download again if you obtained the earlier v0.2.15 package.\n'
          open('notes.md','w').write(notes)
          PY
          hash=$(sha256sum release/install.exe | cut -d ' ' -f 1)
          printf '\nSHA-256 (`install.exe`): `%s`\n' "$hash" >> notes.md
          gh release edit v0.2.15 --notes-file notes.md --draft=false --prerelease --latest=false
          gh api repos/$GH_REPO/releases/$id --jq '{tag_name,draft,assets:[.assets[]|{name,size,digest}]}'
