name: Reissue v0.2.15 (temporary)
on:
  push:
    branches: [master]
    paths: ['.github/workflows/reissue-0215.yml']
permissions:
  contents: read
jobs:
  reissue:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Verify tested build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh api repos/$GH_REPO/actions/jobs/106855116763 --jq .conclusion)" = success
      - uses: actions/download-artifact@v8.0.1
        with:
          name: Talaria-installer
          path: release
          run-id: 35759926618
          github-token: ${{ github.token }}
      - name: Replace withdrawn v0.2.15 only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPAIR_SHA: 1d0acaead6452332330332c06e1b337eaec0fcbc
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate repos/$GH_REPO/releases --jq '.[] | select(.tag_name == "v0.2.15")' > old.json
          test "$(jq -r .draft old.json)" = true
          id=$(jq -r .id old.json)
          gh api --method PATCH repos/$GH_REPO/git/refs/tags/v0.2.15 -f sha="$REPAIR_SHA" -F force=true
          gh release upload v0.2.15 release/install.exe --clobber
          python3 - <<'PY'
          import json,re
          old=json.load(open('old.json'))
          notes=re.sub(r'\nSHA-256.*', '', old['body'], flags=re.S)
          notes+='\n\n**修正版安装包（版本仍为 v0.2.15）**：修复录制组件安装失败及日志打不开；已有组件显示“检查录制组件”，失败后可修复。已通过本机全新下载、校验和安装验证。若之前下载过此版本，请重新下载安装包。\n\nReplacement package: fixes recording component setup and log viewing. Existing components can be checked without reinstalling. Please download again if you obtained the earlier v0.2.15 package.\n'
          open('notes.md','w').write(notes)
          PY
          hash=$(sha256sum release/install.exe | cut -d ' ' -f 1)
          printf '\nSHA-256 (`install.exe`): `%s`\n' "$hash" >> notes.md
          gh release edit v0.2.15 --notes-file notes.md --draft=false --prerelease --latest=false
          gh api repos/$GH_REPO/releases/$id --jq '{tag_name,draft,assets:[.assets[]|{name,size,digest}]}'
